name: Security Gates

# These are REQUIRED checks: the whole point of the project is that they pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tenant-isolation:
    name: tenant A cannot access tenant B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: RLS + API + credential isolation (testcontainers)
        run: cd control-plane && go test -race -tags=integration -run 'Isolation|RLS|Tenant|Credential' ./test/...

  injection-corpus:
    name: prompt-injection corpus is blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd agent-worker && uv sync --all-extras --dev
      - name: Every corpus attack must be blocked or neutralized
        run: cd agent-worker && uv run pytest -m injection -v

  trivy:
    name: trivy (fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: "vuln,secret,misconfig"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
