name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.47.2
      - name: Lint
        run: cd proto && buf lint
      - name: Check formatting
        run: cd proto && buf format --diff --exit-code
      - name: Breaking-change check vs main
        if: github.event_name == 'pull_request'
        run: cd proto && buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'

  go:
    name: control-plane (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build & vet
        run: cd control-plane && go build ./... && go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          working-directory: control-plane
      - name: Test (race + coverage)
        run: cd control-plane && go test -race -coverprofile=coverage.out ./...

  python:
    name: agent-worker (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: cd agent-worker && uv sync --all-extras --dev
      - name: Lint & type-check
        run: cd agent-worker && uv run ruff check . && uv run black --check . && uv run mypy src
      - name: Test
        run: cd agent-worker && uv run pytest --cov=sap_worker --cov-report=term-missing

  frontend:
    name: frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: cd frontend && npm ci
      - name: Type-check & build
        run: cd frontend && npm run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build agent-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
