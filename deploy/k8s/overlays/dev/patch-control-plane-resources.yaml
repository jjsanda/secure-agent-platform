# Dev-only resource tweak for the control plane (strategic-merge patch).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sap-control-plane
spec:
  template:
    spec:
      containers:
        - name: control-plane
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
