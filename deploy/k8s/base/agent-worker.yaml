apiVersion: apps/v1
kind: Deployment
metadata:
  name: sap-agent-worker
  labels:
    app.kubernetes.io/name: agent-worker
    app.kubernetes.io/component: agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
        app.kubernetes.io/component: agent-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-worker
          image: ghcr.io/jjsanda/sap-agent-worker:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WORKER_GRPC_LISTEN
              value: ":50051"
            - name: TOOLPROXY_GRPC_ADDR
              value: "sap-control-plane:9090"
            - name: LLM_ENGINE
              value: "mock"
            - name: LLM_MODEL
              value: "claude-sonnet-5"
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sap-agent-worker
  labels:
    app.kubernetes.io/component: agent-worker
spec:
  selector:
    app.kubernetes.io/name: agent-worker
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
