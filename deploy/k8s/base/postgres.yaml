# Postgres for the kustomize path. Minimal (Deployment + emptyDir), but keeps the
# three-tier role bootstrap so the control plane's sap_app role exists. The init
# script + credentials are supplied by the base kustomization's generators.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sap-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          args: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              value: sap
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sap-db, key: postgres-bootstrap-password }
            - name: POSTGRES_OWNER_PASSWORD
              valueFrom:
                secretKeyRef: { name: sap-db, key: postgres-owner-password }
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: sap-db, key: postgres-app-password }
            - name: POSTGRES_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: sap-db, key: postgres-migrator-password }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "sap"]
            periodSeconds: 5
            failureThreshold: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: sap-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
