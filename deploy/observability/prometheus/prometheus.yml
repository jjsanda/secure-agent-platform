# Prometheus scrape config. The application never exposes /metrics directly;
# it pushes OTLP to the collector, which re-exposes everything on :8889. That
# keeps a single, uniform telemetry path (app -> OTLP -> collector -> Prometheus).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: secure-agent-platform

scrape_configs:
  # Application + resource metrics republished by the collector's Prometheus
  # exporter (sap_runs_total, sap_tool_calls_total, sap_guard_blocks_total, ...).
  - job_name: sap-app
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internal health/throughput metrics.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
