# Grafana dashboard provider — loads every dashboard JSON under the mounted
# path into the "Secure Agent Platform" folder at startup.
apiVersion: 1

providers:
  - name: sap-dashboards
    orgId: 1
    folder: "Secure Agent Platform"
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
