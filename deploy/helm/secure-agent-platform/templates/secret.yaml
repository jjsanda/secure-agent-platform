{{- /*
All credentials live here (never in a plain container env). The control plane
consumes the fully-formed connection URLs via secretKeyRef, so the app-role
password is the only one on the runtime pool and it is never printed in a spec.
*/}}
{{- $host := include "sap.postgres.host" . -}}
{{- $port := 5432 -}}
{{- if .Values.externalDatabase.enabled }}{{ $port = .Values.externalDatabase.port }}{{ end -}}
{{- $db := .Values.postgres.db -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sap.fullname" . }}
  labels:
    {{- include "sap.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-bootstrap-password: {{ .Values.postgres.bootstrapPassword | quote }}
  postgres-owner-password: {{ .Values.postgres.ownerPassword | quote }}
  postgres-app-password: {{ .Values.postgres.appPassword | quote }}
  postgres-migrator-password: {{ .Values.postgres.migratorPassword | quote }}
  # Runtime pool — sap_app (NOBYPASSRLS).
  database-url: {{ printf "postgres://sap_app:%s@%s:%v/%s?sslmode=disable" .Values.postgres.appPassword $host $port $db | quote }}
  # Migrations (DDL) — sap_owner, pgx5 scheme.
  migrate-database-url: {{ printf "pgx5://sap_owner:%s@%s:%v/%s?sslmode=disable" .Values.postgres.ownerPassword $host $port $db | quote }}
  # BYPASSRLS pool — sap_migrator, dev seed only.
  migrator-database-url: {{ printf "postgres://sap_migrator:%s@%s:%v/%s?sslmode=disable" .Values.postgres.migratorPassword $host $port $db | quote }}
  {{- if and (eq .Values.agentWorker.llm.engine "anthropic") .Values.agentWorker.anthropicApiKey }}
  anthropic-api-key: {{ .Values.agentWorker.anthropicApiKey | quote }}
  {{- end }}
