apiVersion: v1
kind: Service
metadata:
  name: {{ include "sap.fullname" . }}-control-plane
  labels:
    {{- include "sap.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    {{- include "sap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.controlPlane.service.grpcPort }}
      targetPort: grpc
