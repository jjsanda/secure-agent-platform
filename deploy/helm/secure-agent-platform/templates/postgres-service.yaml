{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sap.fullname" . }}-postgres
  labels:
    {{- include "sap.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Headless: backs the StatefulSet and gives clients stable DNS at
  # {{ include "sap.fullname" . }}-postgres:5432.
  clusterIP: None
  selector:
    {{- include "sap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
