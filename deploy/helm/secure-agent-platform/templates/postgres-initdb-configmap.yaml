{{- if .Values.postgres.enabled }}
{{- /*
The three-tier role bootstrap (sap_owner / sap_app / sap_migrator), identical to
the compose initdb script. Copied into files/ so the chart stays self-contained.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sap.fullname" . }}-postgres-initdb
  labels:
    {{- include "sap.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  00-init-roles.sh: |
{{ .Files.Get "files/00-init-roles.sh" | indent 4 }}
{{- end }}
