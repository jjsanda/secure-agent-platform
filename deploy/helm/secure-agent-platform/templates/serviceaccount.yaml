{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sap.serviceAccountName" . }}
  labels:
    {{- include "sap.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No component needs the API server; drop the auto-mounted token.
automountServiceAccountToken: false
{{- end }}
