# nginx server for the built SPA. Client-side routes (e.g. /callback, /runs/:id)
# must fall back to index.html so a hard refresh or deep link still loads the app.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets keeps the first paint snappy.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build assets can be cached aggressively and immutably.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: unknown paths render the app, which handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
